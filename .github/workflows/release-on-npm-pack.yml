name: Draft release after npm staging

on:
  workflow_run:
    workflows: ['Stage npm package']
    types: [completed]
    branches: [main]

jobs:
  create-release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      
      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=v$VERSION" >> $GITHUB_OUTPUT
      
      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          commitish: ${{ github.event.workflow_run.head_sha }}
          release_name: "Release ${{ steps.version.outputs.VERSION }}"
          body: |
            ## @bunnix/core v${{ steps.version.outputs.VERSION }}
            
            This draft was prepared after the npm staging workflow succeeded.
            Review the workflow summary for the stage ID or an already-published version notice.
            A package maintainer must approve the staged package on npmjs.com with 2FA.
            Publish this GitHub release only after confirming the version is live on npm.
            
            For more information, see the [documentation](https://github.com/bunnix-js/bunnix).
          draft: true
          prerelease: false
